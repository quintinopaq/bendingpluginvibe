# Elements
bending.element.air=Ar
bending.element.air.description=A dobra de ar é a arte marcial utilizada pelos Nômades do Ar. Foca em velocidade, agilidade e esquiva, priorizando uma defesa impenetrável e mobilidade dinâmica.
bending.element.water=Água
bending.element.water.description=A dobra de água é praticada pelo povo das Tribos da Água. Assim como seu elemento, os dobradores de água são extremamente adaptáveis, versáteis e fluidos.
bending.element.earth=Terra
bending.element.earth.description=A dobra de terra origina-se no Reino da Terra. Exige uma conexão firme e paciência para encontrar o momento exato de golpear com força colossal.
bending.element.fire=Fogo
bending.element.fire.description=A dobra de fogo é praticada pelo povo da Nação do Fogo, sendo a arte de dobra mais agressiva, explosiva e implacável.
# Ability descriptions, instructions and death messages
bending.ability.generic.death={0} foi derrotado por {2} de {1}
bending.ability.airagility.description=Esta habilidade passiva permite que dobradores de ar corram mais rápido e saltem mais alto.
bending.ability.gracefuldescent.description=Esta habilidade passiva permite que dobradores de ar façam pousos suaves, anulando qualquer dano de queda em superfícies.
bending.ability.airwheel.description=Aprimora o AirScooter em uma roda de ar compacta que bloqueia projéteis e desfere dano contínuo a inimigos próximos.
bending.ability.airwheel.death={0} foi atropelado por {2} de {1}
bending.ability.airblade.description=Dispara uma lâmina cortante de ar comprimido em linha reta que causa dano e repele inimigos, apagando chamas em seu trajeto.
bending.ability.airblade.instructions=Segure Shift para formar uma lâmina de ar crescente. Solte Shift para dispará-la para frente. Se estiver usando AirWheel, toque no Shift para desmontar e lançar a roda como uma AirBlade.
bending.ability.airblade.death={0} foi retalhado por {2} de {1}
bending.ability.airblast.description=A técnica fundamental dos dobradores de ar. Dispara uma rajada concentrada de vento que arremessa alvos, apaga chamas e resfria lava.
bending.ability.airblast.instructions=Clique esquerdo para disparar uma rajada de vento. Toque no Shift para alterar a origem da rajada para o local mirado. Clique direito para alternar entre puxar e empurrar.
bending.ability.airbreath.description=Exala uma poderosa baforada de vento capaz de afastar oponentes, extinguir incêndios e solidificar lava.
bending.ability.airbreath.instructions=Segure Shift para soprar uma forte corrente de vento contínua.
bending.ability.airburst.description=Cria uma explosão repulsora de ar em todas as direções para afastar agressores e abrir espaço para recuar em segurança.
bending.ability.airburst.instructions=Segure Shift para carregar o AirBurst até surgirem partículas e solte para liberar uma explosão radial de 360 graus. Alternativamente, clique esquerdo para um cone frontal concentrado, ou caia de uma grande altura com o slot selecionado.
bending.ability.airpunch.description=Desfere um soco de ar implosivo que causa dano e arremessa o alvo utilizando o próprio impulso do dobrador.
bending.ability.airpunch.instructions=Clique esquerdo para golpear.
bending.ability.airpunch.death={0} foi pulverizado por {2} de {1}
bending.ability.airscooter.description=Monta em uma esfera de ar rotativa de alta velocidade, ideal para rápida locomoção, travessia e manobras evasivas.
bending.ability.airscooter.instructions=Pule e clique com o botão esquerdo no ar para ativar.
bending.ability.airshield.description=Uma barreira ciclônica defensiva que circula o usuário, desviando projéteis e arremessando qualquer criatura que se aproxime.
bending.ability.airshield.instructions=Segure Shift para formar um escudo de ar giratório ao seu redor.
bending.ability.airspout.description=Sustenta um vórtice cilíndrico de vento sob os pés do dobrador, concedendo levitação controlada para alcançar locais altos e esquivar-se.
bending.ability.airspout.instructions=Clique esquerdo para ativar. Segure espaço para subir ou Shift para descer. Clique esquerdo novamente para desativar.
bending.ability.airswipe.description=O ataque ofensivo primário do ar. Projeta um arco cortante de vento que rasga o ar, empurra adversários e apaga chamas.
bending.ability.airswipe.instructions=Clique esquerdo para disparar um arco de vento. Segure Shift para concentrar energia e soltar um corte muito mais largo e veloz.
bending.ability.airswipe.death={0} foi cortado por {2} de {1}
bending.ability.tornado.description=Cria um redemoinho massivo de vento capaz de erguer, prender e desorientar alvos, além de permitir escalar penhascos.
bending.ability.tornado.instructions=Segure Shift mirando no chão para erguer o tornado. Clique direito para alternar entre sugar e repelir.
bending.ability.densityshift.description=Esta habilidade passiva permite que dobradores de terra amorteçam impactos e anulem todo dano de queda em superfícies de terra ou pedra.
bending.ability.earthcling.description=Permite que dobradores de terra utilizem suas Luvas de Terra para desacelerar ou parar completamente quedas ao encostar em paredes rochosas.
bending.ability.earthcling.instructions=Segure Shift no slot da Luva de Terra próximo a uma parede para se agarrar ou frear a queda.
bending.ability.ferrocontrol.description=Habilidade passiva de dobra de metal que permite manipular portas de ferro, alçapões e carrinhos de mina à distância.
bending.ability.ferrocontrol.instructions=Clique direito em portas ou alçapões de ferro para abrir/fechar. Segure Shift mirando em um carrinho de mina para guiá-lo.
bending.ability.locksmithing.description=Habilidade passiva de dobradores de metal que permite destrancar baús e recipientes usando barras metálicas.
bending.ability.locksmithing.instructions=Clique direito em um recipiente trancado segurando uma barra de metal para destrancá-lo.
bending.ability.earthpillars.description=Ergue pilares pontiagudos de rocha sob entidades próximas, causando dano severo e arremessando-as pelos ares.
bending.ability.earthshards.description=Estilhaça suas Luvas de Terra em fragmentos rochosos perfurantes de alta velocidade que alvejam os inimigos.
bending.ability.earthshards.death={0} pereceu com estilhaços rochosos de {2} de {1}
bending.ability.catapult.description=Impulsiona uma coluna de rocha rápida sob os pés do dobrador, catapultando-o a grandes alturas e distâncias.
bending.ability.catapult.instructions=Tap sneak to launch yourself in the direction you are looking (there needs to be enough earth behind where you're looking). You can left click to perform a weaker launch instead.
bending.ability.collapse.description=Compacta e afunda blocos de terra no solo, criando trincheiras ou soterrando oponentes em sistemas subterrâneos.
bending.ability.collapse.instructions=Clique esquerdo em um bloco de terra para fazê-lo ceder. Toque no Shift para colapsar uma área maior de blocos.
bending.ability.eartharmor.description=Reveste o corpo do dobrador com uma espessa carapaça de pedra ou metal, concedendo resistência extrema a dano físico.
bending.ability.eartharmor.instructions=Clique esquerdo olhando para uma fonte de terra ou metal para puxar o material e formar a armadura. Segure Shift mirando em terra para erguer um baluarte protetor.
bending.ability.earthblast.description=Arremessa um projétil compacto de rocha contra o alvo, causando forte impacto e recuo.
bending.ability.earthblast.instructions=Toque no Shift mirando em terra para selecionar o bloco. Clique esquerdo para lançá-lo. Clique esquerdo no ar para redirecionar o projétil. Toque no Shift no bloco de um inimigo para destruí-lo.
bending.ability.earthblast.death={0} foi esmagado por {2} de {1}
bending.ability.earthglove.description=Molda manoplas de pedra ou metal nas mãos, permitindo disparar garras que agarram, aprisionam e puxam alvos.
bending.ability.earthglove.instructions=Clique para lançar a luva. Segure Shift para puxar o inimigo preso até você. Toque no Shift na luva de um inimigo para estilhaçá-la.
bending.ability.earthglove.death={1} nocauteou {0} com {2}
bending.ability.earthline.description=Projeta uma linha subterrânea de choque telúrico que avança rasgando o terreno, prendendo ou lançando adversários.
bending.ability.earthline.instructions=Toque no Shift em um bloco de terra para selecionar. Clique esquerdo para propagar a linha no chão. Segure Shift para direcionar o caminho.
bending.ability.earthline.death={0} foi aniquilado por {2} de {1}
bending.ability.earthshot.description=Dispara uma rajada rápida de fragmentos de pedra balísticos contra o adversário.
bending.ability.earthshot.instructions=Toque no Shift mirando em terra para extrair fragmentos. Dobradores de lava podem fundir os blocos em magma antes de disparar com clique esquerdo.
bending.ability.earthshot.death={0} foi perfurado por {2} de {1}
bending.ability.earthsmash.description=Ergue uma rocha gigantesca do solo que pode ser montada como transporte, usada como escudo ou atirada como um projétil devastador.
bending.ability.earthsmash.instructions=Segure Shift até surgirem partículas e solte sobre terra para erguer o pedregulho. Segure Shift mirando nele para controlá-lo e clique esquerdo para arremessá-lo.
bending.ability.earthsmash.death={0} foi esmagado pelo pedregulho de {2} de {1}
bending.ability.earthsurf.description=Desliza velozmente pela superfície sobre uma onda contínua de terra e pedregulhos em movimento.
bending.ability.earthsurf.instructions=Segure Shift até surgirem partículas e solte sobre terra para surfar. Pressione Shift para cancelar.
bending.ability.earthtunnel.description=Escava instantaneamente um túnel seguro através da rocha e terra sólida, extraindo automaticamente minérios valiosos.
bending.ability.earthtunnel.instructions=Segure Shift olhando para uma parede de terra ou pedra para escavar continuamente.
bending.ability.lavadisk.description=Modela uma shuriken circular de rocha fundida que corta blocos macios, queima oponentes e inflige dano massivo.
bending.ability.lavadisk.instructions=Segure Shift mirando em terra ou lava para formar o disco e solte para arremessá-lo velozmente.
bending.ability.lavadisk.death={0} foi cauterizado pelo disco de lava de {2} de {1}
bending.ability.lavaflux.description=Desencadeia uma onda rasteira de magma incandescente que avança pelo solo derretendo defesas e queimando o terreno.
bending.ability.lavaflux.instructions=Segure Shift para despejar uma maré de lava à sua frente.
bending.ability.lavaflux.death={0} foi calcinado por {2} de {1}
bending.ability.metalcable.description=This incredibly versatile ability is used by metalbenders for all purposes. Left click to launch a metal cable. If it connects to an entity
bending.ability.metalcable.instructions=Left click to launch a metal cable. If it connects to an entity or block, you will be pulled towards it. If you hold sneak, the entity or block will be pulled towards you instead. You can also left click again to throw any grabbed targets towards the direction you are looking at. Thrown blocks act as projectiles that deal damage. You will probably need some form of iron or metal in your inventory to use this ability.
bending.ability.raiseearth.description=Faz brotar repentinamente uma coluna sólida ou uma muralha de pedra do solo para bloquear ataques ou erguer o dobrador.
bending.ability.raiseearth.instructions=Clique esquerdo mirando no chão para levantar um pilar. Toque no Shift para erguer uma muralha frontal completa.
bending.ability.shockwave.description=Golpea o solo para propagar uma onda de choque sísmica devastadora que estremece a terra e arremessa todos ao redor.
bending.ability.shockwave.instructions=Segure Shift para carregar e solte para liberar uma onda circular. Alternativamente, clique esquerdo para um cone de choque direcional.
bending.ability.shockwave.death={0} foi arremessado pela onda de choque de {2} de {1}
bending.ability.firekick.description=Desfere um chute flamejante baixo que projeta um arco cortante de fogo rente ao solo, queimando adversários próximos.
bending.ability.firekick.death={0} foi derrubado em chamas pelo chute de {2} de {1}
bending.ability.firespin.description=Um giro acrobático de 360 graus que projeta um anel expansivo de chamas, repelindo e incendiando oponentes ao redor.
bending.ability.firespin.death={0} sucumbiu ao turbilhão de fogo de {2} de {1}
bending.ability.firewheel.description=Dispara uma roda vertical de chamas rolante que avança velozmente pelo solo deixando um rastro de fogo incandescente.
bending.ability.firewheel.death={0} foi incinerado pela roda de fogo de {2} de {1}
bending.ability.blaze.description=Dispara uma barreira rasteira de labaredas expansivas para afastar perseguidores ou cobrir grandes áreas com fogo.
bending.ability.blaze.instructions=Clique esquerdo para enviar um arco frontal de chamas. Toque no Shift para criar um anel de chamas ao seu redor.
bending.ability.blaze.death={0} virou cinzas nas chamas de {2} de {1}
bending.ability.combustion.description=Canaliza energia pura no terceiro olho, liberando um feixe explosivo concentrado de alcance extremo e devastação massiva.
bending.ability.combustion.instructions=Segure Shift para carregar e solte para guiar o feixe de combustão. Clique esquerdo para detonar antecipadamente.
bending.ability.combustion.death={0} foi desintegrado pela combustão de {2} de {1}
bending.ability.fireball.description=Lança uma esfera concentrada de fogo explosivo que voa rapidamente e detona ao colidir com entidades ou terreno.
bending.ability.fireball.instructions=Clique esquerdo para disparar uma bola de fogo na direção mirada.
bending.ability.fireball.death={0} foi carbonizado pela bola de fogo de {2} de {1}
bending.ability.fireblast.description=A técnica de ataque primária da dobra de fogo. Dispara uma labareda veloz que causa dano de impacto e queima alvos.
bending.ability.fireblast.instructions=Clique esquerdo para disparar uma labareda básica. Segure Shift para carregar uma versão explosiva muito mais potente.
bending.ability.fireblast.death={0} foi tostado por {2} de {1}
bending.ability.firebreath.description=Exala um fluxo contínuo e ardente de fogo pelas narinas e boca, iluminando e incinerando tudo à sua frente.
bending.ability.firebreath.instructions=Segure Shift para exalar a respiração de fogo contínua.
bending.ability.fireburst.description=Acumula calor intenso no corpo e libera uma explosão esférica colossal de labaredas que limpa toda a área ao redor.
bending.ability.fireburst.instructions=Segure Shift para concentrar energia térmica até surgirem faíscas e solte para explodir em 360 graus.
bending.ability.fireburst.death={0} foi calcinado pela erupção ígnea de {2} de {1}
bending.ability.firejet.description=Projeta jatos contínuos de fogo sob os pés para planar, voar e se impulsionar rapidamente pelo ar em combates e travessias.
bending.ability.firejet.instructions=Clique esquerdo para voar na direção que estiver olhando. Segure Shift ao clicar para a propulsão máxima JetBlast.
bending.ability.firejet.death={0} foi derretido pelo rastro de fogo de {2} de {1}
bending.ability.fireshield.description=Condensa um escudo defensivo de chamas rotativas que dissipa projéteis inimigos, amortece explosões e queima atacantes.
bending.ability.fireshield.instructions=Segure Shift para manter o escudo de chamas ativo ao seu redor. Clique esquerdo para erguer uma proteção rápida momentânea.
bending.ability.fireshield.death={0} foi queimado ao atingir o escudo de fogo de {2} de {1}
bending.ability.firewall.description=Ergue uma enorme cortina impenetrável de fogo que bloqueia a visão, bloqueia ataques e incinera quem tentar atravessá-la.
bending.ability.firewall.instructions=Clique esquerdo para erguer a muralha de fogo. Segure Shift para avançar a parede na direção mirada.
bending.ability.firewall.death={0} colidiu com a parede de fogo de {2} de {1}
bending.ability.flamerush.description=Projeta dois vórtices paralelos de chamas que convergem em espiral em um feixe incinerador devastador.
bending.ability.flamerush.instructions=Segure Shift para concentrar os dois fluxos e solte para disparar.
bending.ability.flamerush.death={0} foi reduzido a cinzas por {2} de {1}
bending.ability.heatcontrol.description=Permite controlar temperatura e manipular calor, garantindo imunidade a queimaduras, cozinhando alimentos e resfriando lava.
bending.ability.heatcontrol.instructions=Concede imunidade a queimaduras enquanto selecionado. Clique direito para alternar entre Modo Quente e Modo Frio.\nModo Frio: Clique esquerdo para apagar fogo; segure Shift para solidificar lava.\nModo Quente: Clique esquerdo para derreter neve; segure Shift para cozinhar comida na mão.
bending.ability.lightning.description=A técnica de elite dos mestres da Nação do Fogo. Conduz e descarrega um raio devastador de eletricidade pura.
bending.ability.lightning.instructions=Segure Shift até separar as energias yin e yang e solte para desferir o raio elétrico. Se carregar por tempo excessivo, você sofrerá uma descarga!
bending.ability.lightning.death={0} foi eletrocutado pelo relâmpago de {2} de {1}
bending.ability.fastswim.description=Habilidade passiva que permite aos dobradores de água nadar com velocidade e destreza aquática sobre-humanas.
bending.ability.hydrosink.description=Habilidade passiva que anula todo o dano de queda quando o dobrador de água atinge qualquer superfície líquida ou aquosa.
bending.ability.bloodbending.description=A arte proibida mais sombria da água. Manipula os fluidos corporais de seres vivos para controlar e paralisar seus movimentos.
bending.ability.bloodbending.instructions=Segure Shift olhando para o alvo para controlar seus movimentos. Ataque enquanto controla para desarmar o inimigo. Clique direito para alternar alvos.
bending.ability.frostbreath.description=Exala uma névoa glacial gélida que congela superfícies de água em gelo sólido e causa lentidão extrema a entidades atingidas.
bending.ability.frostbreath.instructions=Segure Shift para soprar a respiração congelante.
bending.ability.iceberg.description=Molda uma grande massa de água em um projétil pontiagudo e massivo de gelo compacto capaz de perfurar defesas sólidas.
bending.ability.watergimbal.description=Conjura dois aros aquáticos concêntricos em rotação rápida ao redor do corpo para proteção e disparos perfurantes.
bending.ability.watergimbal.death={0} foi afogado e dilacerado pelos anéis de água de {2} de {1}
bending.ability.healingwaters.description=Canaliza as propriedades restauradoras da água para curar ferimentos, regenerar tecidos e remover aflições do usuário ou de aliados.
bending.ability.healingwaters.instructions=Segure Shift mirando no alvo para curá-lo. Clique direito para alternar entre curar a si mesmo ou a outros jogadores.
bending.ability.icecrawl.description=Rasteja uma trilha rápida de gelo afiado pelo solo que congela os pés do oponente no chão, imobilizando-o.
bending.ability.icecrawl.instructions=Toque no Shift mirando em água ou gelo para selecionar a fonte e clique esquerdo para disparar a trilha congelante.
bending.ability.icecrawl.death={0} congelou até a morte pelo rastro de gelo de {2} de {1}
bending.ability.icespike.description=Projeta estacas perfurantes de gelo cristalizado que brotam do solo ou da água sob os pés dos inimigos.
bending.ability.icespike.instructions=Clique esquerdo para erguer uma estaca de gelo. Toque no Shift para brotar estacas sob todos os inimigos próximos.
bending.ability.icespike.death={0} foi empalado por {2} de {1}
bending.ability.icewall.description=Levanta uma muralha densa de gelo sólido para barrar ataques frontais e isolar oponentes no campo de batalha.
bending.ability.icewall.instructions=Toque no Shift mirando em gelo ou água para erguer a parede. Toque no Shift na parede para quebrá-la.
bending.ability.octopusform.description=Cria uma couraça esférica de água com tentáculos flexíveis que chicoteiam, interceptam projéteis e atacam todos os lados.
bending.ability.octopusform.instructions=Clique esquerdo em água para puxar a fonte e formar o anel. Segure Shift para estender os tentáculos. Clique para golpear e repelir alvos.
bending.ability.octopusform.death={0} foi esbofeteado até a morte pelos tentáculos de {2} de {1}
bending.ability.phasechange.description=Permite alternar instantaneamente o estado físico da água entre líquido fluido e gelo sólido ou derreter neve acumulada.
bending.ability.phasechange.instructions=Segure Shift olhando para gelo ou neve para derretê-los. Clique esquerdo em água líquida para congelá-la instantaneamente.
bending.ability.torrent.description=Canaliza uma espiral contínua e massiva de água que empurra violentamente e pode ser congelada em pleno ar para aprisionar alvos.
bending.ability.torrent.instructions=Clique esquerdo em água para formar um anel. Clique esquerdo novamente para disparar a torrente na direção mirada; clique esquerdo em seguida para congelá-la em gelo.
bending.ability.torrent.death={0} foi arrastado e afogado pela torrente de {2} de {1}
bending.ability.waterbubble.description=Manipula a tensão superficial da água para formar bolsas de ar respiráveis e secas em ambientes subaquáticos.
bending.ability.waterbubble.instructions=Segure Shift sob a água para empurrar o líquido e criar uma bolha de ar.
bending.ability.watermanipulation.description=O golpe clássico da dobra de água. Dispara um arco flexível de água líquida que atinge com a força de um chicote fluido.
bending.ability.watermanipulation.instructions=Toque no Shift mirando em água para selecionar a fonte. Clique esquerdo para disparar contra o alvo; clique esquerdo no ar para redirecionar o fluxo.
bending.ability.watermanipulation.death={0} foi afogado pela manipulação de água de {2} de {1}
bending.ability.waterring.description=Condensa um aro rotativo de água ao redor do tronco do dobrador, servindo como base para múltiplos ataques e manobras.
bending.ability.waterring.instructions=Clique esquerdo em uma fonte de água para formar o anel. Uma vez formado, clique esquerdo para disparar projéteis de gelo perfurantes.
bending.ability.waterring.death={0} foi perfurado pelos dardos de gelo de {2} de {1}
bending.ability.waterspout.description=Constrói e cavalga uma coluna ascendente de água em turbilhão, permitindo manobras aéreas e rápida esquiva sobre oceanos e rios.
bending.ability.waterspout.instructions=Clique esquerdo para ativar sobre a água. Segure espaço para subir ou Shift para descer.
bending.ability.waterwave.description=Monta e surfa em uma crista de onda veloz capaz de se deslocar sobre a terra firme e atropelar adversários.
bending.ability.waterwave.instructions=Com o anel de água ativo, segure Shift para colapsá-lo em uma onda móvel que transporta você. Clique esquerdo no slot PhaseChange para congelar a onda e congelar inimigos.
bending.ability.avatarstate.description=O Estado Avatar é o ápice do poder cósmico, canalizando a sabedoria e a força de todas as vidas passadas do Avatar para realizar prodígios elementais incomparáveis.
bending.ability.avatarstate.instructions=Segure Shift para concentrar e purificar seus chakras. Clique esquerdo no instante correto para abri-los. Solte Shift para despertar o Estado Avatar.
# New Sequences
bending.ability.twisterburst.description=Condensa um vórtice cilíndrico de ventos ciclônicos que avança sugando inimigos em sua trajetória e detona violentamente no ápice.
bending.ability.twisterburst.death={0} foi estraçalhado pelo turbilhão de {2} de {1}
bending.ability.sonicslam.description=Comprime uma esfera de ar sob os pés e despenca contra o solo, liberando uma onda de choque sônica de 360 graus que atordoa e arremessa todos ao redor.
bending.ability.sonicslam.death={0} foi estilhaçado pelo estrondo sônico de {2} de {1}
bending.ability.tidalsurge.description=Evoca uma onda gigante de maré bravia que varre o campo de batalha, afogando adversários, apagando chamas e infligindo dano hidráulico contínuo.
bending.ability.tidalsurge.death={0} foi engolido pelo maremoto de {2} de {1}
bending.ability.frostbarrage.description=Cristaliza múltiplos dardos flutuantes de gelo glacial denso atrás dos ombros e os dispara em salva rápida, perfurando e congelando alvos.
bending.ability.frostbarrage.death={0} foi empalado pela saraivada de gelo de {2} de {1}
bending.ability.seismicfissure.description=Golpea a crosta com força sísmica descomunal, abrindo uma falha tectônica que avança pelo terreno projetando dentes de pedra pontiagudos.
bending.ability.seismicfissure.death={0} foi triturado na fenda sísmica de {2} de {1}
bending.ability.magmaeruption.description=Liquefaz o substrato sob o alvo e desencadeia um gêiser vulcânico devastador de magma que incinera e arremessa vítimas vivas aos céus.
bending.ability.magmaeruption.death={0} foi incinerado na erupção de magma de {2} de {1}
bending.ability.dragonbreath.description=Canaliza a técnica sagrada dos Guerreiros do Sol, liberando uma torrente dupla contínua de fogo solar dourado e chamas espirituais azuis.
bending.ability.dragonbreath.death={0} foi consumido pelo sopro do dragão de {2} de {1}
bending.ability.lightningburst.description=Libera uma descarga eletrostática instantânea em relâmpago ramificado que ricocheteia por múltiplos alvos próximos, punindo alvos molhados ou metálicos.
bending.ability.lightningburst.death={0} foi eletrocutado pela tempestade de raios de {2} de {1}
# New Common Abilities
bending.ability.cyclonetrap.description=Conjura uma armadilha atmosférica turbilhonante que aprisiona, ergue e suspende inimigos antes de detonar em uma explosão de choque.
bending.ability.cyclonetrap.instructions=Clique esquerdo ou toque no Shift para lançar o projétil de vórtice. Ao colidir, ele ancora e prende entidades próximas, detonando após alguns segundos.
bending.ability.cyclonetrap.death={0} foi triturado por {2} de {1}
bending.ability.waterwhip.description=Projeta um chicote longo de água pressurizada que açoita alvos com agilidade, puxando ou empurrando conforme a postura do dobrador.
bending.ability.waterwhip.instructions=Segure Shift para condensar a água na mão. Clique esquerdo para chicotear o alvo. Agachado, o golpe puxa o alvo; em pé, arremessa-o para trás.
bending.ability.waterwhip.death={0} foi chicoteado até a morte por {2} de {1}
bending.ability.bouldertoss.description=Arranca um enorme bloco rochoso do substrato e o arremessa com trajetória parabólica, detonando em estilhaços perfurantes no impacto.
bending.ability.bouldertoss.instructions=Segure Shift perto de pedra ou terra para levitar o pedregulho. Solte o Shift ou clique esquerdo para arremessá-lo.
bending.ability.bouldertoss.death={0} foi esmagado pelo rochedo balístico de {2} de {1}
bending.ability.flamedaggers.description=Empunha duas lâminas compactas de fogo puro nas mãos, aumentando a agilidade, queimando golpes corpo a corpo e desferindo um corte em X duplo.
bending.ability.flamedaggers.instructions=Toque no Shift para acender as adagas de fogo. Com elas ativas, golpes físicos causam dano ígneo. Clique esquerdo para lançar uma onda de corte cruzado em X.
bending.ability.flamedaggers.death={0} foi retalhado em cinzas pelas adagas de fogo de {2} de {1}
# Cross-Element Sequences
bending.ability.vaporblast.description=Superaquece água pressurizada com fogo interno, expelindo um cone expansivo e violento de vapor escaldante que cega oponentes e provoca choque térmico extremo.
bending.ability.vaporblast.death={0} morreu escaldado pelo vapor fervente de {2} de {1}
bending.ability.firevortex.description=Funde ventos com chamas voláteis para conjurar um tornado de fogo que se desloca sugando, suspendendo e incinerando tudo em seu caminho.
bending.ability.firevortex.death={0} foi incinerado no vórtice de fogo de {2} de {1}
bending.ability.mudsurge.description=Liquefaz o solo com água criando uma torrente rasteira de lama densa que avança engolindo inimigos em lama sufocante e lentidão incapacitante.
bending.ability.mudsurge.death={0} foi engolido pela maré de lama de {2} de {1}
bending.ability.glacialblizzard.description=Combina ventos árticos com umidade para irradiar uma nevasca congelante subzero que se expande em anel, aprisionando alvos em gelo maciço.
bending.ability.glacialblizzard.death={0} foi congelado instantaneamente pela nevasca de {2} de {1}
bending.ability.volcanicfissure.description=Abre uma fissura geotérmica ardente infundida com fogo e terra, ejetando gêiseres de magma borbulhante que arremessam e queimam alvos.
bending.ability.volcanicfissure.death={0} foi consumido pela fissura vulcânica de {2} de {1}
